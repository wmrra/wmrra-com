name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: Install latest Dart Sass
        run: |
          LATEST_TAG=$(curl -sSL https://api.github.com/repos/sass/dart-sass/releases/latest | grep -oE '"tag_name": *"[^"]+"' | head -n1 | cut -d'"' -f4)
          curl -sSL "https://github.com/sass/dart-sass/releases/download/${LATEST_TAG}/dart-sass-${LATEST_TAG}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          sudo cp -r dart-sass/* /usr/local/bin/
          rm -rf dart-sass dart-sass.tar.gz
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --baseURL "" --minify
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WMRRA_PROD }}
          projectId: wmrra-prod
